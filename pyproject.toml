[project]
name = "s3-lab"
version = "0.1.0"
description = "S3 work for DS2022"
readme = "README.md"
authors = [
    { name = "Jimmy Brown", email = "131711569+jimmyb25@users.noreply.github.com" }
]
requires-python = ">=3.13"
